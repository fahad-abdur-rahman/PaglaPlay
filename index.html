<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Goatzilla – The Craziest Goat in Town! | PaglaPlay</title>
<meta name="description" content="Goatzilla is a free 3D browser game on PaglaPlay. Headbutt, sprint and cause cartoon chaos as the craziest goat in town.">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" hidden>
  <div id="top">
    <div class="pill">⭐ <b id="sc">0</b></div>
    <div class="pill">🪙 <b id="co">0</b></div>
    <div class="pill" id="hp">❤️❤️❤️</div>
    <button class="pill" id="mu" aria-label="Sound">🔊</button>
  </div>
  <div id="mis"><b id="mt"></b><div id="mb"><i id="mf"></i></div></div>
  <div id="toast"></div>
  <div id="say"></div>
  <div id="st"><i id="sf"></i></div>
</div>

<div id="touch" hidden>
  <div id="joy"><i id="knob"></i></div>
  <button class="tb" id="be">E</button>
  <button class="tb" id="bj">JUMP</button>
  <button class="tb big" id="bh">BONK</button>
</div>

<div id="menu" class="ov">
  <div class="card">
    <div class="brand">PaglaPlay</div>
    <h1>GOATZILLA</h1>
    <p class="tag">The Craziest Goat in Town!</p>
    <p class="how"><b>WASD</b> move · <b>Shift</b> sprint · <b>Space</b> jump (twice!)<br><b>F</b> or <b>click</b> headbutt · <b>E</b> eat &amp; interact · <b>Mouse</b> camera<br>Phone: stick + JUMP / BONK / E buttons</p>
    <p class="how">Bonk crates, cars and villagers. Eat samosas. Run from Chacha's slipper.</p>
    <button class="go" id="play">Play now</button>
  </div>
</div>

<div id="over" class="ov" hidden>
  <div class="card">
    <h2>Chacha got you!</h2>
    <p class="tag" id="gs"></p>
    <button class="go" id="again">Play again</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
